{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <i class="fas fa-exclamation-circle fa-5x text-danger mb-4"></i>
                <h2 class="mb-4">Oops! Something went wrong</h2>
                <p class="lead mb-4">We're sorry, but our server encountered an internal error.</p>
                <p class="text-muted mb-4">Our technical team has been notified and is working to fix the issue.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Go to Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
